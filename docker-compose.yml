services:
    mongodb:
        image: mongo:6.0
        container_name: postmon_mongodb
        restart: unless-stopped
        volumes:
            - mongodb_data:/data/db
        environment:
            MONGO_INITDB_DATABASE: postmon
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - postmon_network

    postmon:
        build: .
        container_name: postmon_app
        restart: unless-stopped
        ports:
            - "9876:9876"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            - POSTMON_DB_HOST=mongodb
            - POSTMON_DB_PORT=27017
            - POSTMON_DB_NAME=postmon
            - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
            - SENTRY_DSN=${SENTRY_DSN:-}
        volumes:
            - ./data:/srv/postmon/data
        networks:
            - postmon_network

    celery_worker:
        build: .
        container_name: postmon_celery
        restart: unless-stopped
        command: celery -A PostmonTaskScheduler worker -B -l info
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            - POSTMON_DB_HOST=mongodb
            - POSTMON_DB_PORT=27017
            - POSTMON_DB_NAME=postmon
            - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
            - GEOCODING_BATCH_SIZE=${GEOCODING_BATCH_SIZE:-100}
        networks:
            - postmon_network

volumes:
    mongodb_data:

networks:
    postmon_network:
        driver: bridge
